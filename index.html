<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRICULA</title>
    <!-- Libreria de Icons -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
    <!-- Framework de Bootsrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/styles_index.css">
    <!-- Favicon de la aplicacion de matricula -->
    <link rel="shortcut icon" href="img/faviconn (1).ico" type="image/x-icon">
</head>
<body> 
    <!-- FORMULARIO PARA MATRICULAS -->
    <article class="contenedor">
        <form id="formRegistro" class="formulario">
            <h2 class="Titulo1">Registro de Nuevo Alumno</h2>
            <input class="diseno-form" type="text" id="regNombres" name="nombres" placeholder="Nombres" required>
            <input class="diseno-form" type="text" id="regApellidos" name="apellidos" placeholder="Apellidos" required><br>
            <input class="diseno-form" type="text" id="regDni" name="dni" placeholder="N° DNI (8 dígitos)" maxlength="8" required>
            <input class="diseno-form" type="email" id="regCorreo" name="correo" placeholder="Correo Electrónico" required><br>
            <input class="diseno-form" type="date" id="regNacimiento" name="nacimiento" required>
            
            <input class="diseno-form" type="text" id="apoNombres" name="apoNombres" placeholder="Nombres del Apoderado" required><br>
            <input class="diseno-form" type="text" id="apoCelular" name="apoCelular" placeholder="Celular del Apoderado" 
            maxlength="9" required>
            <br>
            
            <button type="submit"  class="btn btn-primary">Registrarse</button>
            <p id="mensajeRegistro" class="mensaje"></p>
        </form>

        <a href="login.html">
        <button id="btnAlternarVista"  class="btn btn-secondary" href="login.hmtl">Ya tengo cuenta / Iniciar Sesión</button>
        </a>
    </article>

    <!-- Libreria JS de bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
