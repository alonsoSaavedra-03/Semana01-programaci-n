<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <!-- Libreria de Icons -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
    <!-- Framework de Bootsrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Estilos de css -->
    <link rel="stylesheet" href="css/styles_index.css">
    <!-- Favicon de la aplicacion de matricula -->
    <link rel="shortcut icon" href="img/faviconn (1).ico" type="image/x-icon">
</head>
<body>
    <article class="contenedor">
        <form id="formLogin" class="formulario">
            <h2 class="Titulo1">Iniciar Sesión</h2>
            <input class="diseno-form" type="text" id="logUsuario" placeholder="N° DNI o Usuario" required><br>
            <input class="diseno-form" type="password" id="logPassword" placeholder="Contraseña asignada" required><br>
            <button type="submit" class="btn btn-info">Ingresar</button>
            <p id="mensajeLogin" class="mensaje"></p>
        </form>
    </article>
</body>
</html>
